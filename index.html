<!DOCTYPE html>
<html lang="bn">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ZX Sports Topup</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&family=Bree+Serif&family=Noto+Serif+Bengali:wght@400;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<style>
body{font-family:'Poppins',sans-serif;background:#f8fafc;-webkit-tap-highlight-color:transparent}
input{user-select:text}
.hidden{display:none!important}
#home-sec{font-family:'Bree Serif',serif}
@keyframes fadeInUp{from{opacity:0;transform:scale(.95)}to{opacity:1;transform:scale(1)}}
.animate-fade-in{animation:fadeInUp .4s ease-out forwards}
@keyframes shine{to{transform:translateX(-200%) skewX(12deg)}}
.animate-shine{animation:shine 2.5s infinite}
.product-card{background:#fff;border:1px solid #e5e7eb;border-radius:6px;padding:10px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;transition:all .2s ease}
.product-card:hover{border-color:#81d4fa}
.product-card.selected{border:1.5px solid #03a9f4;background-color:#f0f9ff}
.product-bullet{height:12px;width:12px;background-color:#e5e7eb;border-radius:50%;margin-right:8px;flex-shrink:0}
.product-card.selected .product-bullet{background-color:#03a9f4}
.pay-option-card{border:1px solid #e5e7eb;border-radius:8px;overflow:hidden;background:#fff;cursor:pointer;position:relative;transition:all .2s}
.pay-option-card.selected{border:2px solid #ef4444}
.pay-option-card.selected::before{content:'\f00c';font-family:'Font Awesome 6 Free';font-weight:900;position:absolute;top:0;left:0;background:#ef4444;color:#fff;font-size:10px;padding:2px 6px;border-bottom-right-radius:6px;z-index:10}
</style>
</head>
<body>
<div class="max-w-md mx-auto min-h-screen bg-slate-50 relative">

<header class="bg-white sticky top-0 z-40 flex justify-between items-center shadow-sm px-3 py-2" style="border-bottom:2px solid #f0f0f0;">
  <div class="flex items-center gap-2 font-bold text-lg text-slate-800 cursor-pointer" onclick="showSec('home')"><i class="fas fa-gamepad" style="color:#e91e8c"></i> ZX SPORTS</div>
  <div class="flex items-center gap-2"><button id="obtn" onclick="openOrders()" class="hidden text-xs font-bold px-3 py-1.5 rounded-lg border-2" style="border-color:#e91e8c;color:#e91e8c">Orders</button>
  <div id="hbal" class="hidden px-3 py-1.5 rounded-full text-sm font-bold text-white shadow-md" style="background:linear-gradient(135deg,#e91e8c,#c2185b);"><i class="fas fa-wallet mr-1"></i> ৳ <span id="tot">0</span></div></div>
</header>

<div id="msg" class="text-center py-16 px-5 font-semibold text-gray-600">লগইন হচ্ছে...</div>

<!-- CATEGORY + GAMES (same as index.html home) -->
<section id="home-sec" class="hidden animate-fade-in pb-8 pt-4">
  <div id="home-list" class="space-y-6"></div>
</section>

<!-- TOPUP PAGE -->
<section id="topup-sec" class="hidden animate-fade-in pb-10 bg-slate-50">
  <div class="bg-white p-3 rounded-xl shadow-sm flex items-center gap-4 mb-4 border border-gray-100 mx-2 mt-2 relative">
    <button onclick="showSec('home')" class="text-gray-600 w-8 h-8 flex items-center justify-center rounded-full hover:bg-gray-200 absolute top-2 right-2"><i class="fas fa-times text-lg"></i></button>
    <img id="g-img" src="" class="w-16 h-16 rounded-xl object-cover shadow-sm">
    <div>
      <h3 class="font-bold text-gray-800 text-base" id="g-name">Game Name</h3>
      <p class="text-xs text-gray-700 font-medium" id="g-sub">Game / Topup</p>
    </div>
  </div>

  <div class="bg-white p-3 rounded-xl shadow-sm mb-4 border border-gray-100 mx-2">
    <div class="flex items-center gap-2 mb-3">
      <span class="bg-red-600 text-white w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold shadow-md">1</span>
      <h3 class="font-bold text-gray-800 text-sm">Select Recharge</h3>
    </div>
    <div id="pgrid" class="grid grid-cols-2 gap-2"></div>
    <div class="mt-3 text-right"><a href="#" onclick="openHow();return false" class="text-xs text-gray-600"><i class="fas fa-external-link-alt"></i> কিভাবে অর্ডার করবেন ?</a></div>
  </div>

  <div id="uid-sec" class="bg-white p-3 rounded-xl shadow-sm mb-4 border border-gray-100 mx-2">
    <div class="flex items-center gap-2 mb-2">
      <span class="bg-red-600 text-white w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold shadow-md">2</span>
      <h3 class="font-bold text-gray-800 text-sm">Account Info</h3>
    </div>
    <div class="mb-2">
      <label class="block text-xs font-bold text-gray-700 mb-1">Player Id</label>
      <input type="tel" id="uid" placeholder="Player Id" class="w-full bg-white border border-gray-300 p-2 rounded focus:outline-none focus:border-sky-500 text-sm text-gray-700">
    </div>
    <div id="uidCheckBtn" onclick="uidCheck()" class="w-full bg-gradient-to-r from-red-700 to-orange-500 text-white text-center py-2 rounded font-bold text-sm shadow cursor-pointer relative overflow-hidden">
      Click to check player name
      <div class="absolute inset-0 bg-white opacity-10 transform skew-x-12 translate-x-full animate-shine"></div>
    </div>
  </div>

  <div class="bg-white p-3 rounded-xl shadow-sm mb-4 border border-gray-100 mx-2">
    <div class="flex items-center gap-2 mb-3">
      <span class="bg-red-600 text-white w-5 h-5 flex items-center justify-center rounded-full text-xs font-bold shadow-md">3</span>
      <h3 class="font-bold text-gray-800 text-sm">Select one option</h3>
    </div>
    <div class="grid grid-cols-2 gap-3 mb-2">
      <div id="opt-wallet" class="pay-option-card selected">
        <div class="h-20 flex flex-col items-center justify-center p-2">
          <div class="flex items-center gap-1"><i class="fas fa-wallet text-orange-500 text-2xl"></i><span class="font-bold text-lg text-gray-800">ওয়ালেট</span></div>
        </div>
        <div class="bg-gray-200 text-center py-1 text-xs font-bold text-gray-600">Wallet Pay</div>
      </div>
    </div>
    <div class="flex items-center gap-2 mb-4 px-1">
      <i class="fas fa-info-circle text-gray-400 text-xs"></i>
      <p class="text-[10px] text-gray-500">আপনার একাউন্ট ব্যালেন্স <span class="text-blue-600 font-bold">৳<span id="bal2">0</span></span> (Winning ৳<span id="win">0</span> + Deposit ৳<span id="dep">0</span>)</p>
    </div>
    <button onclick="openConfirm()" class="w-full bg-[#4a148c] text-white py-3 rounded-lg font-bold shadow-lg hover:bg-[#380e6d] transition text-sm">Buy Now</button>
  </div>

  <div id="rules-box" class="bg-white p-3 rounded-xl shadow-sm mb-6 border border-gray-100 mx-2">
    <h3 class="font-bold text-gray-800 text-sm mb-2">Rules &amp; Conditions</h3>
    <div id="rules" class="text-xs text-gray-700 leading-relaxed space-y-2"></div>
  </div>
</section>
</div>
<div id="om" class="hidden fixed inset-0 z-50 bg-black/60 flex items-end justify-center" onclick="if(event.target===this)this.classList.add('hidden')"><div class="bg-white w-full max-w-md rounded-t-2xl p-4 overflow-y-auto" style="max-height:80vh"><div class="flex justify-between items-center mb-3"><b>My Orders</b><button onclick="document.getElementById('om').classList.add('hidden')"><i class="fas fa-times"></i></button></div><div id="ol" class="space-y-2"></div></div></div>
<div id="hm" class="hidden fixed inset-0 z-50 bg-black/60 flex items-center justify-center p-3"><div class="bg-white w-full max-w-md rounded-xl p-3"><div class="flex justify-between items-center mb-2"><b class="text-sm">কিভাবে অর্ডার করবেন?</b><button onclick="closeHow()"><i class="fas fa-times"></i></button></div><div class="aspect-video w-full bg-black rounded overflow-hidden"><iframe id="hv" class="w-full h-full" allowfullscreen></iframe></div></div></div>
<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import { getDatabase, ref, get, push, runTransaction, query, limitToFirst, orderByChild, equalTo, update } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

const app = initializeApp({
  apiKey: "AIzaSyAVIBwz655HFkswolWURMmf4IiSOUrFAU4",
  databaseURL: "https://zx-sports-656da-default-rtdb.firebaseio.com",
  projectId: "zx-sports-656da",
  appId: "1:975944361389:android:df74b1fab0746241f22d24"
});
const db = getDatabase(app);
const USERS = "Shuvo_Users69x ";   // শেষে space আছে, অ্যাপের মতোই
const FALLBACK_IMG = "https://placehold.co/200/e91e8c/white?text=TOP";

// Firebase নোড:
// Shuvo_Topup_Categories/<id> = {name, slot}
// Shuvo_Topup_Games/<id>      = {name, image, categoryId, rules}
// Shuvo_Topup_Packages/<id>   = {gameId, name, price}
// এগুলো খালি থাকলে নিচের ডিফল্ট দেখাবে
let CATS={}, GAMES={}, PACKS=[], uKey=null, user=null, game=null, sel=null, busy=false;
const $ = id => document.getElementById(id);
const num = v => Number(v) || 0;
const esc = t => String(t == null ? '' : t).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

window.showSec = n => { ['home','topup'].forEach(x => $(x+'-sec').classList.toggle('hidden', x !== n)); window.scrollTo(0,0); };
window.navBack = () => {
  if(window.Swal && Swal.isVisible()) return Swal.close();
  if(!$('om').classList.contains('hidden')) return $('om').classList.add('hidden');
  if(!$('hm').classList.contains('hidden')) return closeHow();
  if(!$('topup-sec').classList.contains('hidden')) return showSec('home');
  if(window.ZXApp) ZXApp.close(); else history.back();
};

// নিয়ম: আগে Winning, কম পড়লে বাকিটা Deposit(Balance)
function split(price, w, d){ const fromW = Math.min(w, price); return { fromW, fromD: price - fromW, ok: (w + d) >= price }; }

function render(){
  const w = num(user.Winning), d = num(user.Balance);
  $('win').innerText = w; $('dep').innerText = d; $('bal2').innerText = w + d; $('tot').innerText = w + d;
}

function fail(t){ $('msg').classList.remove('hidden'); $('msg').innerText = t; }
window.addEventListener('error', e => fail('JS error: ' + e.message));
window.addEventListener('unhandledrejection', e => fail('Error: ' + (e.reason && e.reason.message || e.reason)));

async function loadData(){
  const [c,g,p] = await Promise.all([get(ref(db,"Shuvo_Topup_Categories")), get(ref(db,"Shuvo_Topup_Games")), get(ref(db,"Shuvo_Topup_Packages"))]);
  CATS = c.val() || {}; GAMES = g.val() || {};
  PACKS = Object.entries(p.val() || {}).map(([id,v]) => ({id, ...v}));
  const byCat = {}, other = [];
  Object.entries(GAMES).forEach(([id,v]) => (v.categoryId && CATS[v.categoryId] ? (byCat[v.categoryId] = byCat[v.categoryId] || []) : other).push({id, ...v}));
  const gh = list => `<div class="grid grid-cols-3 gap-6 px-4">${list.map(x => `<div class="rounded-xl overflow-hidden cursor-pointer active:scale-95 transition-all duration-200 shadow-sm gcard" data-id="${esc(x.id)}" style="border:1.5px solid #f0f0f0;"><div class="w-full aspect-square overflow-hidden"><img src="${esc(x.image || FALLBACK_IMG)}" class="w-full h-full object-cover" onerror="this.src='${FALLBACK_IMG}'" alt="${esc(x.name)}"></div></div>`).join('')}</div>`;
  let h = '';
  Object.entries(CATS).sort((a,b) => num(a[1].slot) - num(b[1].slot)).forEach(([k,v]) => {
    if(byCat[k]) h += `<div><h3 class="font-bold text-gray-700 text-xl mb-3 text-center" style="letter-spacing:.5px">${esc(v.name)}</h3>${gh(byCat[k])}</div>`;
  });
  if(other.length) h += `<div><h3 class="font-bold text-gray-500 text-lg border-l-4 border-gray-400 pl-2 mb-3 mx-4">Others</h3>${gh(other)}</div>`;
  $('home-list').innerHTML = h || '<div class="text-center text-gray-500 py-10 text-sm">এখনো কোনো গেম যোগ করা হয়নি</div>';
}

$('home-list').addEventListener('click', e => {
  const c = e.target.closest('.gcard'); if(!c) return;
  const id = c.dataset.id; game = {id, ...GAMES[id]}; sel = null; $('uid').value = '';
  const gt = game.type || 'uid'; $('uid-sec').classList.toggle('hidden', gt === 'code');
  $('g-img').src = game.image || FALLBACK_IMG; $('g-img').onerror = function(){ this.src = FALLBACK_IMG; };
  $('g-name').innerText = game.name; $('g-sub').innerText = game.name + (gt === 'code' ? ' (Instant Voucher)' : gt === 'auto-topup' ? ' (Auto Delivery)' : ' (Player ID)');
  resetUidBtn();
  const list = PACKS.filter(x => x.gameId === id).sort((a,b) => num(a.price) - num(b.price));
  $('pgrid').innerHTML = list.map(x => `<div class="product-card" data-id="${esc(x.id)}"><div class="flex items-center"><div class="product-bullet"></div><div><span class="text-xs font-bold text-gray-600 block">${esc(x.name)} ${(gt !== 'uid' && num(x.stockCount) <= 0) ? '<span class="text-[9px] text-red-500 bg-red-100 px-1 rounded ml-1">Stock Out</span>' : ''}</span></div></div><span class="font-bold text-sm" style="color:#e91e8c;">৳${num(x.price)}</span></div>`).join('')
    || '<div class="col-span-2 text-center text-gray-700 py-4">No packages available</div>';
  const rules = String(game.rules || '').split('\n').filter(r => r.trim());
  $('rules-box').classList.toggle('hidden', !rules.length);
  $('rules').innerHTML = rules.map(r => `<p class="flex items-start gap-1"><i class="far fa-dot-circle mt-1 text-[8px] text-gray-400"></i> ${esc(r)}</p>`).join('');
  showSec('topup');
});
$('pgrid').addEventListener('click', e => {
  const c = e.target.closest('.product-card'); if(!c) return;
  document.querySelectorAll('.product-card').forEach(x => x.classList.remove('selected'));
  c.classList.add('selected'); sel = PACKS.find(x => x.id === c.dataset.id);
});

function resetUidBtn(){
  const b = $('uidCheckBtn');
  b.innerHTML = 'Click to check player name<div class="absolute inset-0 bg-white opacity-10 transform skew-x-12 translate-x-full animate-shine"></div>';
  b.classList.remove('bg-black'); b.classList.add('bg-gradient-to-r','from-red-700','to-orange-500');
}
window.uidCheck = () => {
  const uid = $('uid').value.trim(), box = $('uidCheckBtn');
  box.classList.remove('bg-gradient-to-r','from-red-700','to-orange-500'); box.classList.add('bg-black');
  if(!uid){ box.innerText = 'Please enter a UID!'; return; }
  box.innerHTML = '<i class="fas fa-spinner fa-spin"></i> Name is loading...';
  fetch('https://bhauxinfo2.vercel.app/bhau?uid=' + encodeURIComponent(uid) + '&region=BD')
    .then(r => r.json())
    .then(d => { box.innerText = (d.basicInfo && d.basicInfo.nickname) || d.nickname || 'Invalid UID '; })
    .catch(() => { box.innerText = 'No nickname found!'; });
};

window.openConfirm = async () => {
  const type = game.type || 'uid', uid = $('uid').value.trim();
  if(type !== 'code' && !uid) return Swal.fire({icon:'warning', title:'Missing ID', text:'Please enter Player ID!'});
  if(!sel) return Swal.fire({icon:'warning', title:'Select Pack', text:'Please select a recharge package!'});
  if(type !== 'code' && uid.length < 5) return Swal.fire({icon:'warning', title:'Invalid ID', text:'সঠিক Player ID দিন'});
  if(type !== 'uid' && num(sel.stockCount) <= 0) return Swal.fire({icon:'error', title:'Out of Stock', text:'দুঃখিত, এই প্যাকেজ এখন স্টকে নেই।'});
  const price = num(sel.price), s = split(price, num(user.Winning), num(user.Balance));
  if(!s.ok) return Swal.fire({icon:'error', title:'Low Balance', text:'পর্যাপ্ত ব্যালেন্স নেই। আগে টাকা অ্যাড করুন।'});
  const r = await Swal.fire({
    title: 'Confirm Purchase?', icon: 'question', showCancelButton: true,
    confirmButtonColor: '#03a9f4', confirmButtonText: 'Yes, Buy Now',
    html: `Game: ${esc(game.name)}<br>Item: ${esc(sel.name)}<br>${type !== 'code' ? 'Player ID: ' + esc(uid) + '<br>' : ''}Price: ৳${price}<br><small>Winning ৳${s.fromW} + Deposit ৳${s.fromD}</small>`
  });
  if(r.isConfirmed) confirmBuy();
};

const fmtTime = t => { try{ return new Date(num(t)).toLocaleString(); }catch(e){ return ''; } };
window.copyTxt = t => {
  try{ if(navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(t); else throw 0; }
  catch(e){ const a = document.createElement('textarea'); a.value = t; document.body.appendChild(a); a.select(); try{ document.execCommand('copy'); }catch(_){} a.remove(); }
  Swal.fire({toast:true, icon:'success', title:'Copied!', position:'top', showConfirmButton:false, timer:1200});
};
document.addEventListener('click', e => { const b = e.target.closest('.cpy'); if(b) copyTxt(b.dataset.c); });
const codeBox = c => `<div class="mt-2 p-2 bg-gray-100 rounded font-mono text-sm break-all">${esc(c)}</div><button class="cpy mt-2 px-3 py-1 rounded bg-[#4a148c] text-white text-xs font-bold" data-c="${esc(c)}">Copy Code</button>`;

async function deduct(price){
  let used = null;
  const res = await runTransaction(ref(db, USERS + "/" + uKey), cur => {
    if(!cur) return cur;
    const s = split(price, num(cur.Winning), num(cur.Balance));
    if(!s.ok) return;
    used = s; cur.Winning = num(cur.Winning) - s.fromW; cur.Balance = num(cur.Balance) - s.fromD; return cur;
  });
  if(!res.committed || !used) throw new Error("Insufficient Balance");
  user = res.snapshot.val(); return used;
}
async function refund(u){
  const r = await runTransaction(ref(db, USERS + "/" + uKey), cur => {
    if(!cur) return cur; cur.Winning = num(cur.Winning) + u.fromW; cur.Balance = num(cur.Balance) + u.fromD; return cur;
  });
  if(r.snapshot.val()) user = r.snapshot.val();
}
// স্টক থেকে একটি কোড তুলে নেয় (একই কোড দুইজন পাবে না)
async function takeCode(pid, tries = 5){
  if(tries < 1) return null;
  const snap = await get(query(ref(db, 'Shuvo_Topup_Stock/' + pid), limitToFirst(1)));
  if(!snap.exists()) return null;
  let key = null; snap.forEach(c => { key = c.key; });
  let code = null;
  const r = await runTransaction(ref(db, 'Shuvo_Topup_Stock/' + pid + '/' + key), cur => {
    if(cur === null) return null;
    code = (typeof cur === 'object') ? cur.code : cur; return null;
  });
  if(r.committed && code) return String(code);
  return takeCode(pid, tries - 1);
}

window.confirmBuy = async () => {
  if(busy) return; busy = true;
  const type = game.type || 'uid', uid = type === 'code' ? 'Voucher Request' : $('uid').value.trim(), price = num(sel.price);
  let used = null, code = null;
  Swal.fire({title:'Processing...', allowOutsideClick:false, didOpen:() => Swal.showLoading()});
  try{
    let cfg = null;
    if(type === 'auto-topup'){
      cfg = (await get(ref(db, 'Shuvo_Topup_Settings'))).val() || {};
      if(!cfg.autoTopUpApiKey || !cfg.autoTopUpApiUrl || !cfg.autoTopUpCallbackUrl) throw new Error("CONFIG");
    }
    used = await deduct(price);   // ব্যালেন্স কাটা (transaction)
    if(type !== 'uid'){
      code = await takeCode(sel.id);
      if(!code){ await refund(used); used = null; throw new Error("STOCK"); }
      runTransaction(ref(db, 'Shuvo_Topup_Packages/' + sel.id + '/stockCount'), c => Math.max(0, num(c) - 1)).catch(() => {});
    }
    const order = {
      Username: user.Username, Game: game.name, GameId: game.id, Package: sel.name, PackageId: sel.id, PlayerUID: uid, Type: type,
      Price: price, FromWinning: used.fromW, FromBalance: used.fromD, Time: Date.now(),
      Status: type === 'code' ? 'success' : 'pending'
    };
    if(type === 'code') order.RedeemCode = code;
    if(type === 'auto-topup') order.UsedCode = code;
    const oref = push(ref(db, "Shuvo_Topup_Orders"), order);
    await oref;
    render(); $('uid').value = '';

    if(type === 'code'){
      await Swal.fire({icon:'success', title:'Voucher Purchased!', html:'আপনার কোড:' + codeBox(code) + '<div class="text-xs text-gray-500 mt-2">Orders বাটনেও কোড পাবেন।</div>'});
    } else if(type === 'auto-topup'){
      fetch(cfg.autoTopUpApiUrl, {method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({api: cfg.autoTopUpApiKey, playerid: uid, code, orderid: oref.key, url: cfg.autoTopUpCallbackUrl})}).catch(() => {});
      Swal.fire({icon:'info', title:'Processing Order', text:'আপনার টপআপ অটোমেটিক প্রসেস হচ্ছে। একটু অপেক্ষা করুন।', timer:7000, timerProgressBar:true, didOpen:() => Swal.showLoading()});
      await new Promise(r => setTimeout(r, 7000));
      const st = (await get(ref(db, 'Shuvo_Topup_Orders/' + oref.key + '/Status'))).val();
      if(st === 'success' || st === 'completed') await Swal.fire('Success!', 'আপনার টপআপ সম্পন্ন হয়েছে।', 'success');
      else await Swal.fire({icon:'info', title:'Order Placed', text:'অর্ডার প্রসেসিং এ আছে। শীঘ্রই টপআপ পাবেন। Orders বাটনে স্ট্যাটাস দেখুন।'});
    } else {
      await Swal.fire('Success', 'অর্ডার সফল হয়েছে! শীঘ্রই টপআপ পাবেন।', 'success');
    }
    sel = null; await loadData(); showSec('home');
  }catch(e){
    if(used && !code){ try{ await refund(used); }catch(_){} }
    const m = e.message;
    Swal.fire('Error', m === "Insufficient Balance" ? "পর্যাপ্ত ব্যালেন্স নেই" : m === "STOCK" ? "দুঃখিত, এই প্যাকেজ এখন স্টকে নেই। টাকা ফেরত দেওয়া হয়েছে।" : m === "CONFIG" ? "Auto Topup সেট করা নেই। সাপোর্টে জানান।" : "অর্ডার ব্যর্থ হয়েছে, আবার চেষ্টা করুন", 'error');
  }
  busy = false;
};

window.openOrders = async () => {
  $('om').classList.remove('hidden');
  $('ol').innerHTML = '<div class="text-center py-6 text-gray-500"><i class="fas fa-spinner fa-spin"></i></div>';
  try{
    const list = [];
    try{
      const s = await get(query(ref(db, 'Shuvo_Topup_Orders'), orderByChild('Username'), equalTo(user.Username)));
      s.forEach(c => { list.push(c.val()); });
    }catch(_){
      // Firebase এ .indexOn না থাকলে সব অর্ডার এনে এখানেই ফিল্টার করবে
      const s = await get(ref(db, 'Shuvo_Topup_Orders'));
      s.forEach(c => { const v = c.val(); if(v && v.Username === user.Username) list.push(v); });
    }
    list.sort((a,b) => num(b.Time) - num(a.Time));
    $('ol').innerHTML = list.slice(0, 30).map(o => {
      const st = o.Status || 'pending', col = (st === 'success' || st === 'completed') ? 'green' : st === 'rejected' ? 'red' : 'yellow';
      return `<div class="border border-gray-100 rounded-lg p-2 text-sm"><div class="flex justify-between"><b>${esc(o.Game)} — ${esc(o.Package)}</b><span class="text-[10px] px-2 rounded-full bg-${col}-100 text-${col}-700">${esc(st)}</span></div><div class="text-xs text-gray-500">৳${num(o.Price)}${o.Type !== 'code' ? ' • ID: ' + esc(o.PlayerUID) : ''} • ${esc(fmtTime(o.Time))}</div>${o.RedeemCode ? codeBox(o.RedeemCode) : ''}</div>`;
    }).join('') || '<div class="text-center text-gray-500 py-4 text-sm">কোনো অর্ডার নেই</div>';
  }catch(e){ $('ol').innerHTML = '<div class="text-center text-red-500 py-4 text-sm">লোড করা যায়নি<br><span class="text-xs break-all">' + esc(e && e.message || e) + '</span></div>'; }
};

window.openHow = async () => {
  let v = '';
  try{ v = (await get(ref(db, 'Shuvo_Topup_Settings/howToVideo'))).val() || ''; }catch(e){}
  if(!v) return Swal.fire('Tutorial', 'ভিডিও এখনো যোগ করা হয়নি।', 'info');
  const m = String(v).match(/(?:v=|youtu\.be\/|embed\/)([\w-]{11})/);
  $('hv').src = 'https://www.youtube.com/embed/' + (m ? m[1] : v); $('hm').classList.remove('hidden');
};
window.closeHow = () => { $('hv').src = ''; $('hm').classList.add('hidden'); };

async function autoLogin(){
  const q = new URLSearchParams(location.search);
  const name = window.ZXApp ? ZXApp.getUsername() : q.get('u');
  const pass = window.ZXApp ? ZXApp.getPassword() : q.get('p');
  if(!name) return fail("অ্যাপ থেকে লগইন করুন");
  try{
    const snap = await get(ref(db, USERS));
    snap.forEach(c => { const v = c.val(); if(v && v.Username === name && String(v.Password) === String(pass)){ uKey = c.key; user = v; } });
    if(!user) return fail("ইউজার পাওয়া যায়নি");
    await loadData();
    $('msg').classList.add('hidden'); $('hbal').classList.remove('hidden'); $('obtn').classList.remove('hidden');
    render(); showSec('home');
  }catch(e){ fail("সার্ভার এরর: " + (e.message || e)); }
}
autoLogin();
</script>
